name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec turbo run build typecheck
      - run: node scripts/check-tarball.mjs

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Every migration carries the expand-only header; on a PR, the migrations and changesets it adds name each
      # other through `Migration: NNNN_name.sql` lines (docs/release.md).
      - if: github.event_name == 'pull_request'
        run: node scripts/check-migrations.mjs --base "origin/${{ github.base_ref }}"
      - if: github.event_name != 'pull_request'
        run: node scripts/check-migrations.mjs

  compat:
    name: Compat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Only when apps/worker/migrations/ changed (docs/testing.md); the release job runs it unconditionally.
      - id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git diff --quiet "$BASE"...HEAD -- apps/worker/migrations/; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change under apps/worker/migrations/; Compat skipped."
          fi
      - if: steps.changes.outputs.migrations == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.changes.outputs.migrations == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - if: steps.changes.outputs.migrations == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.migrations == 'true'
        run: pnpm test:compat

  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:scripts
      - run: pnpm exec turbo run test

  # A real install and upgrade on the CI account (docs/testing.md, *Integration*). Pushes to main only: fork PRs
  # cannot read the cloudflare-ci secrets. Report-only here; release.yml runs it as the hard gate before publish.
  integration:
    name: Integration
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: cloudflare-ci
    continue-on-error: true
    steps:
      # Until the cloudflare-ci secrets exist the job passes with a notice instead of failing.
      - id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Integration skipped: CLOUDFLARE_API_TOKEN is not set in the cloudflare-ci environment."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@v5
      - if: steps.secrets.outputs.configured == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.secrets.outputs.configured == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - if: steps.secrets.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.secrets.outputs.configured == 'true'
        run: pnpm exec turbo run build
      - if: steps.secrets.outputs.configured == 'true'
        run: pnpm test:integration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @furea/admin exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/admin/test-results/
          retention-days: 7
